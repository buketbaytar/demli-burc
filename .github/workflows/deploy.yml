# Her "main" push'unda: veriyi doğrula -> site/data.js'i üret -> Python/JS eşitliğini test et -> site/ klasörünü GitHub Pages'e yayınla.
# Testlerden biri başarısız olursa site güncellenmez (bozuk içerik yayına çıkmaz).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Veri setini doğrula
        run: python engine.py --validate

      - name: site/data.js üret
        run: python build_site.py

      - name: Python ↔ JS eşitlik testi
        run: node parity_test.cjs 1000

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
